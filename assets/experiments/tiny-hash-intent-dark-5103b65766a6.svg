<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img"><title>Tiny Hash Intent: one from-scratch fit, four evaluation representations and 301 retained errors across 3,080 test rows. English closed-set classification has no OOD rejection; int8 storage is not a speed benchmark.</title><path d="M12 1H403L419 17V246L408 257H1V12Z" fill="#0d1117" stroke="#39394f"/><path d="M1 34V12L12 1H52" fill="none" stroke="#64d8d5" stroke-width="2"/><text x="18" y="26" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">TINY HASH INTENT / FROM SCRATCH</text><text x="18" y="56" fill="#edf2f8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" font-weight="700">Small model, real errors.</text><text x="18" y="82" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Run a trained intent classifier</text><text x="18" y="101" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">locally, with its full error report.</text><text x="18" y="140" fill="#64d8d5" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">301 / 3,080</text><text x="18" y="161" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Test errors · One fit, four views</text><text x="18" y="187" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">English closed set · No OOD rejection</text><text x="18" y="204" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Int8 storage is not a speed benchmark</text><path d="M18 221H402" stroke="#39394f"/><text x="18" y="243" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open model &amp; evidence →</text></svg>