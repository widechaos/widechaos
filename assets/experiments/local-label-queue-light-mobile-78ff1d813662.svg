<svg xmlns="http://www.w3.org/2000/svg" width="300" height="282" role="img" viewBox="0 0 300 282"><title>Local Label Queue: twelve abstentions can produce 100% reviewed progress with zero assigned labels. Browser-local manual text labeling preserves labels, abstentions and unfinished work. No autosave or label-quality judgment.</title><path fill="#fff" stroke="#d9cdee" d="M12 1H283L299 17V270L288 281H1V12Z"/><path fill="none" stroke="#087e8b" stroke-width="2" d="M1 34V12L12 1H52"/><text x="18" y="26" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">LOCAL LABEL QUEUE / MANUAL REVIEW</text><text x="18" y="56" fill="#1f2328" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" font-weight="700">Reviewed with no labels.</text><text x="18" y="82" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">Label text or record an abstention,</text><text x="18" y="101" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">then export every source record.</text><text x="18" y="140" fill="#087e8b" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">100% · 0 labels</text><text x="18" y="161" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">12 synthetic records · All abstained</text><text x="18" y="187" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Review progress is not label quality</text><text x="18" y="204" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">No autosave · Download a checkpoint</text><path stroke="#d9cdee" d="M18 245H282"/><text x="18" y="267" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open queue &amp; evidence →<