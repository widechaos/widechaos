<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" role="img" viewBox="0 0 420 258"><title>Prediction Metric Desk: a synthetic 75% conditional accuracy score is three of four evaluated records, while known-label coverage is four of seven. Retain missing, abstained, invalid and duplicate outputs. Saved predictions only; no new model training.</title><path fill="#fff" stroke="#d9cdee" d="M12 1H403L419 17V246L408 257H1V12Z"/><path fill="none" stroke="#087e8b" stroke-width="2" d="M1 34V12L12 1H52"/><text x="18" y="26" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">PREDICTION METRIC / AUDIT DESK</text><text x="18" y="56" fill="#1f2328" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" font-weight="700">Which records got counted?</text><text x="18" y="82" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Audit saved classification outputs,</text><text x="18" y="101" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">keeping gaps and invalid rows visible.</text><text x="18" y="140" fill="#087e8b" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">75% · 4 / 7</text><text x="18" y="161" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Conditional accuracy · Known-label coverage</text><text x="18" y="187" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Synthetic example · Different denominators</text><text x="18" y="204" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Completion bounds are not confidence limits</text><path stroke="#d9cdee" d="M18 221H402"/><text x="18" y="243" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open audit desk →</text></svg>