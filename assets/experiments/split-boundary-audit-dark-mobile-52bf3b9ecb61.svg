<svg xmlns="http://www.w3.org/2000/svg" width="300" height="282" viewBox="0 0 300 282" role="img"><title>Split Boundary Audit Group Planner: keep declared groups and exact-text connections together across train, validation and test. All records retained; greedy planning is not optimal and does not certify statistical independence.</title><path d="M12 1H283L299 17V270L288 281H1V12Z" fill="#0d1117" stroke="#39394f"/><path d="M1 34V12L12 1H52" fill="none" stroke="#64d8d5" stroke-width="2"/><text x="18" y="26" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">SPLIT BOUNDARY / GROUP PLANNER</text><text x="18" y="56" fill="#edf2f8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" font-weight="700">Keep groups together.</text><text x="18" y="82" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">Plan train, validation and test splits,</text><text x="18" y="101" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">then export records and review warnings.</text><text x="18" y="140" fill="#64d8d5" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">30 / 3 / 3</text><text x="18" y="161" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Actual split · 36-record synthetic example</text><text x="18" y="187" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Greedy planning is not optimal</text><text x="18" y="204" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">No independence or semantic guarantee</text><path d="M18 245H282" stroke="#39394f"/><text x="18" y="267" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open planner &amp; 