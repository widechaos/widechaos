<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img"><title>Split Boundary Audit Group Planner: keep declared groups and exact-text connections together across train, validation and test. All records retained; greedy planning is not optimal and does not certify statistical independence.</title><path d="M12 1H403L419 17V246L408 257H1V12Z" fill="#ffffff" stroke="#d9cdee"/><path d="M1 34V12L12 1H52" fill="none" stroke="#087e8b" stroke-width="2"/><text x="18" y="26" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">SPLIT BOUNDARY / GROUP PLANNER</text><text x="18" y="56" fill="#1f2328" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" font-weight="700">Keep groups together.</text><text x="18" y="82" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Plan train, validation and test splits,</text><text x="18" y="101" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">then export records and review warnings.</text><text x="18" y="140" fill="#087e8b" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">30 / 3 / 3</text><text x="18" y="161" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Actual split · 36-record synthetic example</text><text x="18" y="187" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Greedy planning is not optimal</text><text x="18" y="204" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">No independence or semantic guarantee</text><path d="M18 221H402" stroke="#d9cdee"/><text x="18" y="243" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open planner &amp; evidence →</text></svg>