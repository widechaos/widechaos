<svg xmlns="http://www.w3.org/2000/svg" width="300" height="282" viewBox="0 0 300 282" role="img"><title>JSON Wire Browser Lab: inspect browser decoding, JSON parsing and re-encoding separately. Parsed values can round-trip while original bytes change; no semantic correctness guarantee.</title><path d="M12 1H283L299 17V270L288 281H1V12Z" fill="#0d1117" stroke="#39394f"/><path d="M1 34V12L12 1H52" fill="none" stroke="#64d8d5" stroke-width="2"/><text x="18" y="26" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">JSON WIRE / BROWSER LAB</text><text x="18" y="56" fill="#edf2f8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" font-weight="700">What survives a round-trip?</text><text x="18" y="82" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">Inspect browser JSON decoding,</text><text x="18" y="101" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">parsing and re-encoding separately.</text><text x="18" y="140" fill="#64d8d5" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">Bytes ≠ values</text><text x="18" y="161" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">A parsed value can survive a round-trip</text><text x="18" y="187" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Decoding, parsing and encoding differ</text><text x="18" y="204" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Not a semantic correctness guarantee</text><path d="M18 245H282" stroke="#39394f"/><text x="18" y="267" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open lab &amp; evidence →</text></svg>