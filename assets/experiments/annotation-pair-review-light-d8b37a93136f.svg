<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img"><title>Annotation Pair Review: 100% conditional agreement can cover just one of twelve synthetic records. Browser-local manual review keeps disagreements, abstentions and unfinished work visible. Agreement is not accuracy; no autosave.</title><path d="M12 1H403L419 17V246L408 257H1V12Z" fill="#ffffff" stroke="#d9cdee"/><path d="M1 34V12L12 1H52" fill="none" stroke="#087e8b" stroke-width="2"/><text x="18" y="26" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">ANNOTATION PAIR / MANUAL REVIEW</text><text x="18" y="56" fill="#1f2328" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" font-weight="700">Agreement needs coverage.</text><text x="18" y="82" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Compare two annotation files,</text><text x="18" y="101" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">then review each record manually.</text><text x="18" y="140" fill="#087e8b" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">100% · 1 / 12</text><text x="18" y="161" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Partial synthetic example · Both labelled</text><text x="18" y="187" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Agreement is not accuracy</text><text x="18" y="204" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">No autosave · Export to keep work</text><path d="M18 221H402" stroke="#d9cdee"/><text x="18" y="243" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open review &amp; evidence →</text></svg>