<svg xmlns="http://www.w3.org/2000/svg" width="300" height="282" viewBox="0 0 300 282" role="img"><title>Tiny Hash Intent: one from-scratch fit, four evaluation representations and 301 retained errors across 3,080 test rows. English closed-set classification has no OOD rejection; int8 storage is not a speed benchmark.</title><path d="M12 1H283L299 17V270L288 281H1V12Z" fill="#ffffff" stroke="#d9cdee"/><path d="M1 34V12L12 1H52" fill="none" stroke="#087e8b" stroke-width="2"/><text x="18" y="26" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">TINY HASH INTENT / FROM SCRATCH</text><text x="18" y="56" fill="#1f2328" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" font-weight="700">Small model, real errors.</text><text x="18" y="82" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">Run a trained intent classifier</text><text x="18" y="101" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">locally, with its full error report.</text><text x="18" y="140" fill="#087e8b" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">301 / 3,080</text><text x="18" y="161" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Test errors · One fit, four views</text><text x="18" y="187" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">English closed set · No OOD rejection</text><text x="18" y="204" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Int8 storage is not a speed benchmark</text><path d="M18 245H282" stroke="#d9cdee"/><text x="18" y="267" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open model &amp; evidence →</text></svg>