<svg xmlns="http://www.w3.org/2000/svg" width="300" height="282" viewBox="0 0 300 282" role="img"><title>Offline Evidence Finder: browser-local English and Chinese lexical retrieval with exact quotes and UTF-16 offsets. One of four unanswerable development queries returned a hit; matching quotes do not prove semantic support.</title><path d="M12 1H283L299 17V270L288 281H1V12Z" fill="#ffffff" stroke="#d9cdee"/><path d="M1 34V12L12 1H52" fill="none" stroke="#087e8b" stroke-width="2"/><text x="18" y="26" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">OFFLINE EVIDENCE FINDER</text><text x="18" y="56" fill="#1f2328" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" font-weight="700">Exact quotes are not proof.</text><text x="18" y="82" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">Search English and Chinese text,</text><text x="18" y="101" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">then export quotes and source offsets.</text><text x="18" y="140" fill="#087e8b" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">1 / 4</text><text x="18" y="161" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Unanswerable queries returned a hit</text><text x="18" y="187" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Lexical matching, not semantic support</text><text x="18" y="204" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Hand-picked development queries</text><path d="M18 245H282" stroke="#d9cdee"/><text x="18" y="267" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open lab &amp; evidence →</text></svg>