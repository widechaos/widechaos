<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img"><title>Offline Evidence Finder: browser-local English and Chinese lexical retrieval with exact quotes and UTF-16 offsets. One of four unanswerable development queries returned a hit; matching quotes do not prove semantic support.</title><path d="M12 1H403L419 17V246L408 257H1V12Z" fill="#0d1117" stroke="#39394f"/><path d="M1 34V12L12 1H52" fill="none" stroke="#64d8d5" stroke-width="2"/><text x="18" y="26" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">OFFLINE EVIDENCE FINDER</text><text x="18" y="56" fill="#edf2f8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" font-weight="700">Exact quotes are not proof.</text><text x="18" y="82" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Search English and Chinese text,</text><text x="18" y="101" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">then export quotes and source offsets.</text><text x="18" y="140" fill="#64d8d5" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">1 / 4</text><text x="18" y="161" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Unanswerable queries returned a hit</text><text x="18" y="187" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Lexical matching, not semantic support</text><text x="18" y="204" fill="#a5b0c0" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Hand-picked development queries</text><path d="M18 221H402" stroke="#39394f"/><text x="18" y="243" fill="#c3a7fa" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Open lab &amp; evidence →</text></svg>