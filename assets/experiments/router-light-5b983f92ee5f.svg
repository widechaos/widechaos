<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img"><title>Bilingual Router: strict all-field accuracy 7.6% to 47.2%, JSON validity 98.6% to 95.5%; 576 synthetic tests, one run. Read results and failures.</title><path d="M12 1H403L419 17V246L408 257H1V12Z" fill="#ffffff" stroke="#d9cdee"/><path d="M1 34V12L12 1H52" fill="none" stroke="#087e8b" stroke-width="2"/><text x="18" y="26" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">BILINGUAL ROUTER / LoRA</text><text x="18" y="56" fill="#1f2328" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" font-weight="700">Valid JSON is not enough.</text><text x="18" y="82" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Can a small model route bilingual</text><text x="18" y="101" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">requests into the correct action?</text><text x="18" y="140" fill="#087e8b" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="27" font-weight="600">7.6% → 47.2%</text><text x="18" y="161" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">Strict all-field accuracy</text><text x="18" y="187" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">JSON validity: 98.6% → 95.5%</text><text x="18" y="204" fill="#59636e" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">576 synthetic tests · One run</text><path d="M18 221H402" stroke="#d9cdee"/><text x="18" y="243" fill="#7541c8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="400">Results &amp; evidence →</text></svg>