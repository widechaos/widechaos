name: Refresh contribution stars
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'contributions/projects/**'
      - 'profile-card-captions.json'
      - 'scripts/update-profile-cards.py'
      - '.github/workflows/profile-cards.yml'
concurrency:
  group: profile-contribution-cards
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Render cards from public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-profile-cards.py
      - name: Save changed cards
        run: |
          git config user.name 'Renchao Wu'
          git config user.email '42173584+widechaos@users.noreply.github.com'
          git add assets/profile/contributions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution star counts'
          git pull --rebase
          git push
